<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Hallway</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#F5F1E8;
font-family:'Libre Baskerville',serif;
font-weight:700;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.dust{
position:absolute;
inset:0;
background:
radial-gradient(circle at 20% 30%,rgba(255,255,255,.16) 1px,transparent 1px),
radial-gradient(circle at 70% 60%,rgba(255,255,255,.10) 1px,transparent 1px);
background-size:180px 180px;
animation:dust 18s linear infinite;
opacity:.35;
}

.container{
position:relative;
z-index:2;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.title{
font-size:32px;
letter-spacing:2px;
margin-bottom:40px;
animation:fade 2s forwards;
}

.hallway{
position:relative;
width:520px;
height:520px;
}


.door{
position:absolute;
width:95px;
height:170px;
background:#17120c;
border:2px solid #b99b5a;
box-shadow:0 0 20px rgba(255,215,120,.3);
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
transition:.8s;
font-size:15px;
}

.door:hover{
transform:scale(1.08);
box-shadow:0 0 40px rgba(255,215,120,.8);
}


.door1{
top:0;
left:212px;
}

.door2{
top:85px;
right:20px;
}

.door3{
bottom:85px;
right:20px;
}

.door4{
bottom:0;
left:212px;
}

.door5{
bottom:85px;
left:20px;
}

.door6{
top:85px;
left:20px;
}


.light{
position:absolute;
width:13px;
height:13px;
border-radius:50%;
background:#ffe6a3;
box-shadow:0 0 25px #ffe6a3;
}

.light1{
top:75px;
left:260px;
}

.light2{
top:180px;
right:95px;
}

.light3{
bottom:180px;
right:95px;
}

.light4{
bottom:75px;
left:260px;
}

.light5{
bottom:180px;
left:95px;
}

.light6{
top:180px;
left:95px;
}


@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

@keyframes dust{
from{transform:translateY(0);}
to{transform:translateY(-150px);}
}

</style>
</head>

<body>

<div class="dust"></div>

<div class="container">

<div class="title">
Your journey begins...
</div>

<div class="hallway">

<div class="door door1">Door 1</div>
<div class="door door2">Door 2</div>
<div class="door door3">Door 3</div>
<div class="door door4">Door 4</div>
<div class="door door5">Door 5</div>
<div class="door door6">Door 6</div>

<div class="light light1"></div>
<div class="light light2"></div>
<div class="light light3"></div>
<div class="light light4"></div>
<div class="light light5"></div>
<div class="light light6"></div>

</div>

</div>

</body>
</html>
