<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Project</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:white;
font-family:'Libre Baskerville',serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
width:90%;
max-width:700px;
}

.line1,
.key,
.line2,
.line3,
.buttons{
opacity:0;
}

.line1{
font-size:30px;
animation:fade 2s forwards;
}

.key{
font-size:90px;
margin:35px 0;
animation:fade 2s forwards;
animation-delay:3s;
}

.line2{
font-size:24px;
margin-bottom:10px;
animation:fade 2s forwards;
animation-delay:5s;
}

.line3{
font-size:24px;
margin-bottom:35px;
animation:fade 2s forwards;
animation-delay:7s;
}

.buttons{
animation:fade 2s forwards;
animation-delay:9s;
}

button{
background:transparent;
border:1px solid white;
color:white;
padding:12px 30px;
margin:10px;
font-size:18px;
border-radius:30px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:white;
color:black;
}

@keyframes fade{
to{
opacity:1;
}
}
</style>
</head>

<body>

<div class="container">

<div class="line1">
Har chaabi ki ek manzil hoti hai.
</div>

<div class="key">
🗝️
</div>

<div class="line2">
Sawaal bas itna hai...
</div>

<div class="line3">
...kya tum usse dhoondhna chahoge?
</div>

<div class="buttons">
<button>Nahi</button>
<button>Haan</button>
</div>

</div>

</body>
  </html>
